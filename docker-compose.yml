services:
  app:
    build:
      context: .
      target: development
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/default.conf:/etc/nginx/http.d/default.conf
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=base64:fjuqn2+5C2blp/isTTshvUscL6FyxyEkZdVSrqAV59k=
      - DB_HOST=mysql
      - DB_DATABASE=khmermart24
      - DB_USERNAME=khmermart24
      - DB_PASSWORD=secret
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
    depends_on:
      - mysql
      - redis
    networks:
      - khmermart24

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: khmermart24
      MYSQL_USER: khmermart24
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - khmermart24

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - khmermart24

  # Optional: PHPMyAdmin for database management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: khmermart24
      PMA_PASSWORD: secret
    depends_on:
      - mysql
    networks:
      - khmermart24

volumes:
  mysql_data:
  redis_data:

networks:
  khmermart24:
    driver: bridge
